<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>powerNote — อนุญาตไมโครโฟน</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1.5rem; line-height: 1.7; }
    button { font: inherit; padding: .6rem 1.4rem; border-radius: .5rem; border: 1px solid #ff6f00; background: #ff6f00; color: #fff; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    #status { margin-top: 1.2rem; font-weight: 600; }
    .ok { color: #128a45; }
    .bad { color: #c0392b; }
    code { background: #f0f0f0; padding: .1rem .35rem; border-radius: .25rem; }
  </style>
</head>
<body>
  <h1>อนุญาตไมโครโฟน</h1>
  <p>
    ส่วนขยายนี้ถอดเสียงปุ่ม <code>Alt+P</code> ให้เบื้องหลัง โดยไม่ต้องสลับหน้าจอไป Chrome
    แต่ Chrome จะให้สิทธิ์ไมค์กับหน้าเบื้องหลังได้ก็ต่อเมื่อเคยกดอนุญาตจากหน้านี้มาก่อนหนึ่งครั้ง
  </p>
  <p>กดปุ่มข้างล่างครั้งเดียว แล้วเลือก <strong>อนุญาต / Allow</strong> ในกล่องที่ Chrome เด้งขึ้นมา</p>
  <button id="grant">อนุญาตไมโครโฟน</button>
  <p id="status"></p>
  <script src="permission.js"></script>
</body>
</html>
