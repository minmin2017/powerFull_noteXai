name: Render Manim Videos (Docker)

on:
  workflow_dispatch:
    inputs:
      scene_file:
        description: 'Path to python script'
        required: true
        default: 'valves_circuits_anim.py'
      scene_names:
        description: 'Scenes to render (space-separated)'
        required: true
        default: 'HV01_CheckValve HV02_SpoolValve HC01_Regenerative'
      quality:
        description: 'manim quality letter (l/m/h/p/k)'
        required: false
        default: 'm'
      fps:
        description: 'frames per second'
        required: false
        default: '30'
      resolution:
        description: 'optional WIDTH,HEIGHT override (e.g. 1920,1080) — leave empty to use the quality preset resolution'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:latest
      options: --user root
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Thai Font & Language Support (5 seconds in Docker)
        run: |
          apt-get update && apt-get install -y fonts-thai-tlwg texlive-lang-other

      - name: Render Manim Video
        run: |
          RES_FLAG=""
          if [ -n "${{ github.event.inputs.resolution }}" ]; then
            RES_FLAG="-r ${{ github.event.inputs.resolution }}"
          fi
          manim -q${{ github.event.inputs.quality }} --fps ${{ github.event.inputs.fps }} $RES_FLAG ${{ github.event.inputs.scene_file }} ${{ github.event.inputs.scene_names }}

      - name: Upload Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manim-videos
          path: media/videos/
