name: Manim Render (Headless)

on:
  push:
    paths:
      - 'scratch/manim_*.py'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:latest
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Thai Fonts
        run: |
          apt-get update
          apt-get install -y fonts-thai-tlwg texlive-lang-other
          
      - name: Render Video
        run: manim -pqh scratch/manim_part6.py Part6_TabularMethod
        
      - name: Upload Videos
        uses: actions/upload-artifact@v4
        with:
          name: manim-rendered-videos
          path: media/videos/**/*.mp4
